name: Temporal candidate verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9aa8f2de7c043d9321c24bce44ce4d6a091ada78
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
      - name: Install frozen dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Prove documentation changes preserve emitted code
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import ts from 'typescript';
          const parent = '81104cfad49d86483d1926376e81be99d27d2f07';
          const expected = [
            'apps/api/tests/space-control-capture.test.ts',
            'apps/worker/tests/temporal-sandbox.test.ts',
            'apps/worker/tests/temporal/extra-timer.ts',
            'apps/worker/tests/temporal/harness.ts',
            'apps/worker/tests/temporal/pre-patch-loader.cjs'
          ];
          const files = execFileSync('git', ['diff', '--name-only', parent, 'HEAD'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          assert.deepEqual(files.sort(), expected.sort());
          const compilerOptions = { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ESNext, jsx: ts.JsxEmit.ReactJSX, allowJs: true, checkJs: false, removeComments: true, sourceMap: false, inlineSourceMap: false };
          function emit(source, fileName) {
            const result = ts.transpileModule(source, { fileName, compilerOptions, reportDiagnostics: true });
            const errors = (result.diagnostics ?? []).filter(item => item.category === ts.DiagnosticCategory.Error);
            assert.equal(errors.length, 0, errors.map(item => ts.flattenDiagnosticMessageText(item.messageText, '\n')).join('\n'));
            return result.outputText;
          }
          for (const file of files) {
            const before = execFileSync('git', ['show', `${parent}:${file}`], { encoding: 'utf8' });
            const after = readFileSync(file, 'utf8');
            assert.equal(emit(after, file), emit(before, file), `Executable output changed: ${file}`);
            console.log(`Identical emitted code: ${file}`);
          }
          NODE
      - name: Build and check workspace dependencies
        run: npm run check
      - name: Hygiene preflight
        run: npm run hygiene:preflight
