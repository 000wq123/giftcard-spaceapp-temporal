name: Temporal candidate verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: temporal-time-skipping
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
      - name: Resolve matching testing dependency
        run: npm install --package-lock-only --ignore-scripts --save-exact -D -w @space/worker @temporalio/testing@1.24.0
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Build and check workspace dependencies
        run: npm run check
      - name: Record synthetic histories with all sandbox assertions
        if: hashFiles('apps/worker/tests/fixtures/workflow-histories/dotGoalWorkflow.json') == ''
        env:
          TEMPORAL_RECORD_HISTORIES: '1'
        run: npm exec -w @space/worker -- vitest run tests/temporal-sandbox.test.ts --reporter=verbose
      - name: Verify frozen histories without recording
        run: npm exec -w @space/worker -- vitest run tests/temporal-sandbox.test.ts --reporter=verbose
      - name: Preserve tested lockfile and synthetic history fixtures
        run: |
          git config user.name 'Davor Petrovski'
          git config user.email 'davor7282@gmail.com'
          git add apps/worker/package.json package-lock.json apps/worker/tests/fixtures/workflow-histories
          npm run hygiene:preflight
          if ! git diff --cached --quiet; then
            git commit -s -m 'test(worker): record real sandbox histories and pin testing SDK'
            git push origin HEAD:temporal-time-skipping
          fi
      - name: Worker suite
        run: npm test -w @space/worker
      - name: Full public test suite
        run: |
          if npm test > "$RUNNER_TEMP/spaceapp-public-tests.txt" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/spaceapp-public-tests.txt"
          else
            tail -n 180 "$RUNNER_TEMP/spaceapp-public-tests.txt"
            exit 1
          fi
      - name: Production build
        run: npm run build
      - name: Final hygiene preflight
        run: npm run hygiene:preflight
